name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch changes in the distributions' packages
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ci:
    uses: mablanco/shared-github-workflows/.github/workflows/ansible-role-ci.yml@main
    with:
      molecule-matrix: >-
        [{"name": "default"},
         {"name": "upgrade", "scenario": "upgrade"}]
