---
- name: Unhide | Install the tool and cron
  ansible.builtin.apt:
    name:
      - unhide
      - cron
    state: present

- name: Unhide | Create the log directory
  ansible.builtin.file:
    path: "{{ unhide_log_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Unhide | Install the audit script
  ansible.builtin.template:
    src: unhide.cron.j2
    dest: /usr/local/bin/unhide_cron.sh
    owner: root
    group: root
    mode: "0750"

- name: Unhide | Schedule the daily audit
  ansible.builtin.cron:
    name: Launch Unhide audit
    hour: "{{ unhide_cron_hour }}"
    minute: "{{ unhide_cron_minute }}"
    cron_file: unhide
    user: root
    job: /usr/local/bin/unhide_cron.sh 2>&1 | logger -t unhide

- name: Unhide | Remove the files of older versions of this role
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/shelldetector_cron.sh
    - /etc/cron.d/shelldetector
